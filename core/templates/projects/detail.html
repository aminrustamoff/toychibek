{% extends 'base.html' %}

{% block title %}{{ project.title }}{% endblock %}

{% block content %}

    <h1>{{ project.title }}</h1>
    <p>{{ project.description }}</p>
    <p>Price: {{ project.price }}</p>
    <p> {{ project.status }}</p>
    <img src="{{ project.image.url }}" alt="{{ project.title }}">
{% endblock %}
